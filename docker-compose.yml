name: 'pro_messanger ads backend'

services:
  db:
    image: postgres:15-alpine
    container_name: channel_db_2
    # Креды берутся из .env (compose подставляет ${...} автоматически), не хардкодим в репозитории.
    # Порт наружу НЕ публикуем — база доступна только внутри docker-сети по имени 'db'.
    environment:
      POSTGRES_DB: ${DATABASES_NAME}
      POSTGRES_USER: ${DATABASES_USER}
      POSTGRES_PASSWORD: ${DATABASES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck: # Проверка готовности базы
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASES_USER} -d ${DATABASES_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: channel_redis
    restart: unless-stopped

  web:
    build: .
    container_name: channel_web_2
    command: >
      sh -c "
        echo 'Ждем базу данных...' &&
        sleep 5 &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:9000 --workers 3 core.wsgi:application
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    # Все переменные (SECRET_KEY, DEBUG, ALLOWED_HOSTS, DATABASES_*) приходят из .env через env_file.
    # Порт наружу НЕ публикуем — доступ к Django только через nginx.
    env_file:
      - .env
    environment:
      # Настройки для Celery внутри Docker (хост - имя сервиса 'redis')
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: channel_worker
    command: celery -A core worker -l info
    volumes:
      - media_volume:/app/media # ОБЯЗАТЕЛЬНО: воркер должен видеть файлы, чтобы удалить их
    env_file:
      - .env
    environment:
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web # Чтобы миграции точно прошли до запуска воркера
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: channel_beat
    command: celery -A core beat -l info
    env_file:
      - .env
    environment:
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: channel_nginx_2
    # Слушаем только локально на 8080. Наружу домен отдаёт системный nginx хоста,
    # который проксирует ads-api.vipads.uz -> 127.0.0.1:8080.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: