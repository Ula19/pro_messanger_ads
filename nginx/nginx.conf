events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django {
        server web:9000;
    }

    # Если хостовый nginx передал X-Forwarded-Proto — используем его, иначе схему запроса.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~."    $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name ads-api.vipads.uz;

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Accept-Ranges bytes;
        }

        location / {
            proxy_pass http://django/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Пробрасываем оригинальную схему от хостового nginx (там терминируется TLS).
            # Если заголовка нет (прямой заход на 18080) — берём схему текущего запроса.
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_redirect off;

            # Для больших файлов (загрузка видео)
            client_max_body_size 100M;
        }
    }
}
