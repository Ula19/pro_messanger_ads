events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django {
        server web:9000;
    }

    # HTTP → редирект на HTTPS
    server {
        listen 80;
        server_name ads-api.vipads.uz;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name ads-api.vipads.uz;

        ssl_certificate     /etc/letsencrypt/live/ads-api.vipads.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ads-api.vipads.uz/privkey.pem;

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Accept-Ranges bytes;
        }

        location / {
            proxy_pass http://django/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # Для больших файлов (загрузка видео)
            client_max_body_size 100M;
        }
    }
}
